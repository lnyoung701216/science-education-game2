<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Science Education Game</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      color: #222;
    }

    header {
      height: 70px;
      background: white;
      border-bottom: 1px solid #ddd;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 8%;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav a {
      text-decoration: none;
      color: #222;
      margin-left: 30px;
    }

    .hero {
      height: calc(100vh - 70px);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
    }

    .hero h1 {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      color: #666;
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    SCIENCE GAME
  </div>

  <nav>
    <a href="#">HOME</a>
  </nav>

</header>


<section class="hero">

  <h1>Science Education Game</h1>

  <p>
    과학을 게임으로 배우는 교육 프로젝트
  </p>

</section>


</body>
</html>
